<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="/main.css">
</head>

<body>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.js"></script>

<div class="menu flex-row-center-center">
    <form th:action="@{/users}">
        <button>Home</button>
    </form>
    <form th:action="@{/users/changeUser}">
        <button>Your account</button>
    </form>
    <form th:action="@{/auth/login}">
        <button type="submit">Log out</button>
    </form>
</div>

<div class="flex-column-center-center">
<label th:text="'Selected group: ' + ${selectedGroup.name}"/>
<div class="flex-row-center-center">
    <div class="groupContainer flex-column-center-center">

        <div class="groups flex-row-center-center">
            <label>Expenses</label>
            <div class="element flex-row-center-center" th:each="expense, iterStat : ${expenses}">
                <img th:src="${#strings.isEmpty(expense.photoUrl) ? '/images/default_image.png' : expense.photoUrl}" alt=" " class="photo"/>
                <label th:text="${expense.name}"/>
                <label th:text="${expense.amount}"/>
                <label th:text="'Paid by ' + ${expense.paidBy.name}"/>
            </div>
        </div>

        <div class="homeButtons flex-row-center-center">
            <form th:action="@{/expenses/addExpense}">
                <button type="submit"  th:value="${selectedGroup.id}" th:name="selectedGroup"> Add Expense</button>
            </form>
            <form th:action="@{/expenses/expensesOverview}">
                <button type="submit"  th:value="${selectedGroup.id}" th:name="selectedGroup"> Balance</button>
            </form>
        </div>

        <div class="groups flex-row-center-center">
            <label>Duties</label>
            <div class="element flex-row-center-center" th:each="duty, iterStat : ${duties}">
                <img th:src="${#strings.isEmpty(duty.photoUrl) ? '/images/default_image.png' : duty.photoUrl}" alt=" " class="photo"/>
                <label th:text="${duty.name}"/>
                <label th:text="${duty.value}"/>
                <label th:text="'Done by ' + ${duty.user.name}"/>
            </div>
        </div>
        <div class="homeButtons flex-row-center-center">
            <form th:action="@{/duties/addDuty}">
                <button type="submit"  th:value="${selectedGroup.id}" th:name="selectedGroup"> Add Duty</button>
            </form>
            <form th:action="@{/duties/dutiesOverview}">
                <button type="submit"  th:value="${selectedGroup.id}" th:name="selectedGroup"> Balance</button>
            </form>
        </div>
    </div>
    <div class="homeButtons flex-column-center-center">
        <div id="calendar"></div>
        <form th:action="@{/events/addEvent}">
            <button type="submit"  th:value="${selectedGroup.id}" th:name="selectedGroup"> Add Event</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.js"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var eventsFromServer = /*[[${events}]]*/ [];
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'en', // Set your locale
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
                },
                events: eventsFromServer, // Fetch events from Spring backend
                selectable: true
            });
            calendar.render();
        });
    </script>
</div>
</div>
</body>
</html>
