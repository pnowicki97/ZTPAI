<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="/main.css">
</head>

<body>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.js"></script>

    <div class="menu flex-row-center-center">
        <form th:action="@{/users}">
            <button>Home</button>
        </form>
        <form th:action="@{/calendar}">
            <button>Your account</button>
        </form>
        <form th:action="@{/auth/login}">
            <button type="submit">Log out</button>
        </form>
    </div>

    <div class="flex-row-center-center">
        <div class="groupContainer flex-column-center-center">

            <label>Your Groups</label>

            <form th:action="@{/groups}" method="GET" class="groups flex-row-center-center">
                <div th:each="group : ${groups}" class="element flex-row-center-center">
                    <button type="submit" th:value="${group.id}" th:name="selectedGroup" class=" flex-row-center-center">
                        <label th:text="${group.name}" />
                    </button>
                </div>
            </form>
        </div>
        <div id="calendar"></div>

        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.js"></script>
        <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var eventsFromServer = /*[[${events}]]*/ [];
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'en', // Set your locale
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
                },
                events: eventsFromServer, // Fetch events from Spring backend
                selectable: true
            });
            calendar.render();
        });
        </script>
    </div>

    <div class="homeButtons flex-row-center-center">
        <form th:action="@{/groups/addGroup}" class = "homeButtons">
            <button type="submit">Add Group</button>
        </form>
    </div>

</body>
</html>
