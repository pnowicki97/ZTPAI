<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.js"></script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="/main.css">
</head>

<body>
<div class="menu flex-row-center-center">
    <button>home</button>
    <button>calendar</button>
    <button th:action="@{/groups}"> groups</button>
</div>
    <div class="container flex-column-center-center">

        <template id="expense-template">
            <div class="element">
                <label></label>
                <paidBy></paidBy>
                <amount></amount>
            </div>
        </template>

        <div id="calendar"></div>

        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                var calendarEl = document.getElementById('calendar');
                var calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth',
                    locale: 'en', // Set your locale
                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
                    },
                    events: '/events', // Fetch events from Spring backend
                    selectable: true,
                    select: function(info) {
                        // Handle date selection (e.g., create a new event)
                        console.log('selected ' + info.startStr + ' to ' + info.endStr);
                    },
                    eventClick: function(info) {
                        // Handle event click (e.g., show event details)
                        console.log('Event: ' + info.event.title);
                    },
                    editable: true, // Allow event dragging and resizing
                    eventDrop: function(info) {
                        // Handle event drop (e.g., update event date on server)
                        console.log(info.event.title + " was dropped on " + info.event.start.toISOString());
                    },
                    eventResize: function(info) {
                        // Handle event resize (e.g., update event duration on server)
                        console.log(info.event.title + " was resized to " + info.event.end.toISOString());
                    }
                });
                calendar.render();
            });
        </script>

    </div>
    <div class="homeButtons flex-row-center-center">
        <form th:action="@{/users}" class = "homeButtons">
            <button type="submit">Back</button>
        </form>
        <form th:action="@{/expenses/addExpense}" class = "homeButtons">
            <button type="submit" th:name="selectedGroup"> Add Expense</button>
        </form>
    </div>
</body>
</html>
