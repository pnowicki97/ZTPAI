<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="/main.css">
</head>

<body>

<div class="menu">
    <form th:action="@{/groups}">
        <button type="submit"  th:value="${group.id}" th:name="selectedGroup"> Back</button>
    </form>
    <form th:action="@{/users}">
        <button>Home</button>
    </form>
    <form th:action="@{/users/changeUser}">
        <button>Your account</button>
    </form>
        <form th:action="@{/auth/login}">
            <button class="logoutButton" type="submit">Log out</button>
        </form>
</div>

<div class="container">
    <div class="groupHeadline">
        <label>EXPENSES BALANCE</label>
    </div>
    <div class="flex-left">
        <div class="elementContainer">
            <div class="elementHeadline">
                <label>Expenses</label>
            </div>
            <div class="elements">
                <div class="element" th:each="expense, iterStat : ${expenses}">
                    <img th:src="${#strings.isEmpty(expense.photoUrl) ? '/images/default_image.png' : expense.photoUrl}" alt=" " class="photo"/>
                    <label th:text="${expense.name}"/>
                    <label th:text="${expense.amount}"/>
                    <label>Paid by </label>
                    <img th:src="${#strings.isEmpty(expense.paidBy.photo_url) ? '/images/default_image.png' : expense.paidBy.photo_url}" alt=" " class="photo"/>
                    <label th:text="' ' + ${expense.paidBy.name}"/>
                </div>
            </div>
        </div>
        <div class="elementContainer">
            <div class="elementHeadline">
                <label>Balances</label>
            </div>
            <div class="elements">
                <div class="element" th:each="balance, iterStat : ${balances}">
                    <img th:src="${#strings.isEmpty(balance.lender.photoUrl) ? '/images/default_image.png' : balance.lender.photoUrl}" alt=" " class="photo"/>
                    <label th:text="${balance.lender.name} + ' gets'"/>
                    <label th:text="${balance.amount}"/>
                    <label>from </label>
                    <img th:src="${#strings.isEmpty(balance.debtor.photoUrl) ? '/images/default_image.png' : balance.debtor.photoUrl}" alt=" " class="photo"/>
                    <label th:text="' ' + ${balance.debtor.name}"/>
                </div>
            </div>
        </div>
    </div>
    <div class="flex-column-center-center">
        <form th:action="@{/expenses/addExpense}">
            <button class="elementButtons" type="submit"  th:value="${group.id}" th:name="selectedGroup"> Add Expense</button>
        </form>
        <div class="flex-row-center-center">
            <form th:action="@{/export/expenses}">
                <button class="secondElementButtons" type="submit"  th:value="${group.id}" th:name="selectedGroup">Export Expenses</button>
            </form>
            <form th:action="@{/import/expenses}" >
                <button class="secondElementButtons" type="submit"  th:value="${group.id}" th:name="selectedGroup">Import Expenses</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
