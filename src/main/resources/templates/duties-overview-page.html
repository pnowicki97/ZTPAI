<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="/main.css">
</head>

<body>

<div class="menu">
    <form th:action="@{/groups}">
        <button type="submit"  th:value="${group.id}" th:name="selectedGroup"> Back</button>
    </form>
    <form th:action="@{/users}">
        <button>Home</button>
    </form>
    <form th:action="@{/users/changeUser}">
        <button>Your account</button>
    </form>
        <form th:action="@{/auth/login}">
            <button class="logoutButton" type="submit">Log out</button>
        </form>
</div>
<div class="container">
    <div class="groupHeadline">
        <label>DUTIES BALANCE</label>
    </div>
    <div class="flex-left">
        <div class="elementContainer">
            <div class="elementHeadline">
                <label>Duties</label>
            </div>
            <div class="elements">
                <div class="element" th:each="duty, iterStat : ${duties}">
                    <img th:src="${#strings.isEmpty(duty.photoUrl) ? '/images/default_image.png' : duty.photoUrl}" alt=" " class="photo"/>
                    <label th:text="${duty.name}"/>
                    <label th:text="${duty.value}"/>
                    <label>done by </label>
                    <img th:src="${#strings.isEmpty(duty.user.photo_url) ? '/images/default_image.png' : duty.user.photo_url}" alt=" " class="photo"/>
                    <label th:text="' ' + ${duty.user.name}"/>
                </div>
            </div>
        </div>
        <div class="elementContainer">
            <div class="elementHeadline">
                <label>Ranking</label>
            </div>
            <div class="elements">
                <div class="element" th:each="balance, iterStat : ${balances}">
                    <img th:src="${#strings.isEmpty(balance.lender.photoUrl) ? '/images/default_image.png' : balance.lender.photoUrl}" alt=" " class="photo"/>
                    <label th:text="${balance.lender.name}"/>
                    <label th:text="${balance.amount}"/>
                </div>
            </div>
        </div>
    </div>
    <div class="flex-column-center-center">
        <form th:action="@{/duties/addDuty}">
            <button class="elementButtons" type="submit"  th:value="${group.id}" th:name="selectedGroup"> Add Duty</button>
        </form>
        <div class="flex-row-center-center">
            <form th:action="@{/export/duties}">
                <button class="secondElementButtons" type="submit"  th:value="${group.id}" th:name="selectedGroup">Export Duties</button>
            </form>
            <form th:action="@{/import/duties}">
                <button class="secondElementButtons" type="submit"  th:value="${group.id}" th:name="selectedGroup">Import Duties</button>
            </form>
        </div>
    </div>

</div>

</body>
</html>
